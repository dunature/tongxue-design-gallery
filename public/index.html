<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>仝学 TONGXUE · 10 套全站视觉设计</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#101722;--line:#26303f;--muted:#a1aec1;--cyan:#75ddf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f5fa;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
header{height:78px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain}.brand strong{font-size:19px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2.4px}.edition{font-size:11px;letter-spacing:2px;color:var(--muted)}.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 78px)}
aside{padding:25px 16px;border-right:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 12px 14px}.choices{display:grid;gap:5px}.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;padding:10px;border-radius:8px;color:#b9c5d7;background:transparent;width:100%}.choice:hover{background:#172333}.choice[aria-pressed=true]{background:#192737;border-color:#456276;color:white}.choice img{width:57px;aspect-ratio:3/2;object-fit:cover;border-radius:3px}.choice b{font-size:13px;font-weight:500}.choice small{display:block;font:10px/1.7 ui-monospace,monospace;color:#889ab0}.side-note{font-size:11px;line-height:1.9;color:#8fa0b5;margin:22px 12px}
main{padding:26px 32px 30px;min-width:0}.topline{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:25px;letter-spacing:1px;margin:4px 0 0;font-weight:500}.counter{color:var(--cyan);font:11px ui-monospace,monospace;letter-spacing:2px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.control{padding:8px 13px;border:1px solid #344255;border-radius:6px;background:#111d2b;color:#e2eaf4;font-size:12px;white-space:nowrap}.control:hover{border-color:#80c9e1}.control.primary{background:#c0edf4;color:#14232c;border-color:transparent}.stage{position:relative;width:100%;max-width:1320px;margin:auto;overflow:hidden;background:#101d2c;border:1px solid #334154;border-radius:8px;box-shadow:0 18px 80px #0005;isolation:isolate}.stage>.concept{display:block;width:100%;height:auto;aspect-ratio:3/2}.fx{position:absolute;pointer-events:none;overflow:hidden;color:var(--accent);mask-image:radial-gradient(ellipse,#000 38%,transparent 74%)}.fx>*{position:absolute;pointer-events:none}.glow{inset:7%;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--accent) 25%,transparent),transparent 66%);filter:blur(12px);animation:breathe 7s ease-in-out infinite}.ring{border:1px solid currentColor;border-radius:50%;width:88%;height:38%;left:6%;top:32%;opacity:.25;transform:rotate(-20deg);box-shadow:0 0 15px color-mix(in srgb,var(--accent) 18%,transparent);animation:orbit 20s linear infinite}.r2{animation-delay:-7s;animation-duration:26s;width:70%;left:15%}.r3{animation-delay:-12s;width:98%;left:1%;opacity:.12}.beam{width:25%;height:170%;left:48%;top:-35%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 22%,transparent),transparent);filter:blur(13px);transform:rotate(20deg);animation:beam 9s ease-in-out infinite}.sweep{height:1px;left:4%;width:92%;top:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 15px currentColor;opacity:.55;animation:scan 6s ease-in-out infinite}.dust{width:2px;height:2px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;animation:drift 7s ease-in-out infinite}.trace{inset:12%;width:76%;height:76%;overflow:visible;opacity:.42}.trace path{fill:none;stroke:currentColor;stroke-width:.35;stroke-dasharray:3 7;animation:travel 10s linear infinite}.trace circle{fill:currentColor;animation:blink 4s ease-in-out infinite}
.fx .ring,.fx .beam,.fx .sweep,.fx .trace{display:none}.fx-orbit .ring{display:block}.fx-breath .sweep{display:block;opacity:.15;animation-duration:12s}.fx-breath .glow{mix-blend-mode:multiply;opacity:.4}.fx-aurora .beam{display:block;width:70%;height:65%;top:20%;left:10%;background:linear-gradient(120deg,transparent,#50efd935,#8081ff26,transparent);filter:blur(18px);animation:aurora 10s ease-in-out infinite}.fx-aurora .glow{animation-duration:5s}.fx-scan .sweep,.fx-scan .beam{display:block}.fx-scan .beam{width:10%;opacity:.5;animation-duration:13s}.fx-pulse .ring{display:block;width:55%;height:55%;left:22%;top:20%;animation:ripple 5s ease-out infinite}.fx-pulse .r2{animation-delay:-1.7s}.fx-pulse .r3{animation-delay:-3.3s}.fx-beam .beam{display:block;width:45%;opacity:.45;animation-duration:14s}.fx-beam .dust{opacity:.4}.fx-ripple .ring{display:block;animation:ripple 8s linear infinite;transform:rotate(-12deg)}.fx-ripple .r2{animation-delay:-2.7s}.fx-ripple .r3{animation-delay:-5.4s}.fx-network .trace{display:block}.fx-network .glow{opacity:.4}.fx-pages .beam{display:block;left:15%;width:13%;filter:blur(4px);background:linear-gradient(90deg,transparent,#a0d9f855,transparent);animation:pagegleam 12s ease-in-out infinite}.fx-pages .dust{display:none}.fx-spotlight .beam{display:block;transform-origin:50% 0;width:42%;left:35%;animation:spotlight 12s ease-in-out infinite;background:linear-gradient(90deg,transparent,#8aa5ff30,transparent)}.fx-spotlight .ring{display:block;top:78%;height:14%;width:60%;left:20%;animation:breathe 5s ease-in-out infinite;opacity:.25}
.paused .fx *{animation-play-state:paused!important}.paused .fx{opacity:.55}.below{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-top:18px}.motion{font-size:13px;color:#d5e6f1}.motion span{display:inline-block;width:6px;height:6px;background:var(--cyan);border-radius:50%;margin-right:9px;box-shadow:0 0 10px #7df4fc88}.note{max-width:520px;font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.9}.stepper{display:flex;gap:8px}.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.overview[hidden],.focus[hidden]{display:none}.tile{background:#111a27;border:1px solid #2b394b;padding:0;overflow:hidden;border-radius:8px;text-align:left;color:white}.tile img{width:100%;display:block;aspect-ratio:3/2}.tile div{padding:12px 16px}.tile b{font-weight:500}.tile small{display:block;color:var(--muted);margin-top:4px}.tile:hover{border-color:var(--cyan)}footer{font-size:10px;letter-spacing:1px;color:#788aa1;border-top:1px solid var(--line);margin-top:24px;padding-top:14px}
@keyframes breathe{0%,100%{opacity:.28;transform:scale(.94)}50%{opacity:.7;transform:scale(1.07)}}@keyframes orbit{0%{transform:rotate(-22deg) scale(.92);opacity:.12}50%{transform:rotate(-8deg) scale(1.04);opacity:.32}100%{transform:rotate(-22deg) scale(.92);opacity:.12}}@keyframes scan{0%,100%{top:8%;opacity:0}18%{opacity:.5}78%{opacity:.4}90%{top:94%;opacity:0}}@keyframes beam{0%,100%{transform:translateX(-75%) rotate(20deg);opacity:.1}50%{transform:translateX(75%) rotate(26deg);opacity:.7}}@keyframes drift{0%,100%{transform:translateY(7px);opacity:.12}50%{transform:translateY(-15px);opacity:.75}}@keyframes aurora{0%,100%{transform:rotate(-17deg) translate(-4%,5%) scale(1);opacity:.35}50%{transform:rotate(8deg) translate(8%,-6%) scale(1.22);opacity:.8}}@keyframes ripple{0%{transform:scale(.65);opacity:0}20%{opacity:.36}100%{transform:scale(1.65);opacity:0}}@keyframes travel{to{stroke-dashoffset:-100}}@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}@keyframes pagegleam{0%,10%{transform:translateX(-100%) rotate(-32deg);opacity:0}35%,65%{opacity:.45}90%,100%{transform:translateX(700%) rotate(-32deg);opacity:0}}@keyframes spotlight{0%,100%{transform:rotate(-16deg);opacity:.2}50%{transform:rotate(19deg);opacity:.75}}
@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:23px 20px}.choice{gap:8px;padding:8px}.choice img{width:40px}.topline{align-items:start;flex-direction:column}header{padding:0 20px}.edition{font-size:9px}.overview{gap:12px}}
@media(max-width:700px){header{height:70px;padding:0 16px}.edition{display:none}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:14px 12px}.eyebrow,.side-note{display:none}.choices{display:flex;overflow-x:auto;gap:8px}.choice{min-width:144px;padding:7px}.choice img{width:44px}main{padding:20px 14px}.topline{gap:14px}h1{font-size:22px}.control{padding:8px 10px}.below{gap:12px}.note{font-size:10px}.overview{grid-template-columns:1fr}.brand strong{font-size:17px}.brand img{width:40px;height:40px}}

.stage>.concept{aspect-ratio:auto;min-height:0}.stage{max-width:1230px}.pagebar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.page-tabs{display:flex;gap:5px;padding:4px;border:1px solid #2b394b;border-radius:8px;background:#0e1722}.page-tab{padding:9px 22px;border:0;border-radius:5px;background:transparent;color:#9caec3;font-size:13px}.page-tab[aria-pressed=true]{color:#14222d;background:#c0edf4}.page-tab:hover{color:#fff;background:#26374b}.page-tab[aria-pressed=true]:hover{color:#14222d;background:#d8f7ff}#pageLabel{color:#8ba1b9;font-size:12px;letter-spacing:2px}.tile-image{padding:0!important;aspect-ratio:3/4;overflow:hidden;background:#070d17}.tile-image img{height:100%;width:100%;object-fit:contain;object-position:top;aspect-ratio:auto}.overview{grid-template-columns:repeat(4,minmax(0,1fr));align-items:start}.below{margin-bottom:10px}aside{align-self:start;position:sticky;top:0}.topline{position:relative}.fx{opacity:.72}
@media(max-width:1050px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.page-tab{padding:8px 15px}.pagebar{align-items:start}}
@media(max-width:700px){aside{position:static}.page-tabs{width:100%;justify-content:space-around}.page-tab{padding:9px 11px;font-size:12px}.pagebar{display:block}#pageLabel{display:none}.stage>.concept{min-height:0}.overview{grid-template-columns:1fr}.tile-image{aspect-ratio:auto;max-height:none}.tile-image img{height:auto}}
.viewbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}.viewbar .control[aria-pressed=true]{background:#c0edf4;color:#14232c;border-color:transparent}.pixel-info{font-size:12px;color:var(--muted);margin-left:6px}
.stage[data-state=loading],.stage[data-state=error]{min-height:240px}
.stage:not([data-state=ready])>.concept,.stage:not([data-state=ready])>.fx{visibility:hidden}
.load-status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:var(--muted);font-size:13px}
.stage[data-state=ready]>.load-status{display:none}
</style></head>
<body>
<header><div class="brand"><img src="brand-icon.svg" alt=""><div><strong>仝学 TONGXUE</strong><small>FULL WEBSITE VISUAL STUDIES</small></div></div><div class="edition">10 STYLES · 40 PAGE DESIGNS · 2026.10.01</div></header>
<div class="layout"><aside><p class="eyebrow">选择一套视觉风格</p><nav class="choices" aria-label="全站视觉风格"></nav><p class="side-note">以临床问题为起点。<br>让学术表达保持严谨，<br>让探索拥有温度。</p></aside>
<main><div class="topline"><div><div class="counter" id="counter"></div><h1 id="title"></h1></div><div class="actions"><button class="control" id="motionButton" aria-pressed="true">暂停动效</button><button class="control" id="overviewButton">整套对比</button><a class="control" id="original" target="_blank" rel="noopener">查看原图 ↗</a><a class="control primary" id="download" download>下载 PNG ↓</a></div></div>
<div class="pagebar"><div class="page-tabs" aria-label="页面类型"></div><span id="pageLabel"></span></div><section class="focus" aria-label="当前方向动效预览"><div class="viewbar" role="group" aria-label="图片显示大小"><button class="control" id="nativeSize" aria-pressed="true">原像素 · 最清晰</button><button class="control" id="fitSize" aria-pressed="false">铺满区域</button><span class="pixel-info" id="pixelInfo" aria-live="polite"></span></div><div class="stage" data-state="loading" aria-busy="true"><img class="concept" id="concept" alt="" fetchpriority="high" decoding="async"><div class="fx" aria-hidden="true"></div><div class="load-status"><span id="loadMessage" role="status" aria-live="polite"></span><button class="control" id="retryImage" hidden>重新加载</button></div></div><div class="below"><div><div class="motion"><span></span><b id="motionName"></b></div><p class="note">每套包含首页、科研成果、能力中心、论文服务。默认按屏幕原像素显示，避免放大变糊；可下载 PNG 查看原图。光效仅用于演示氛围，图中业务控件尚未实现。</p></div><div class="stepper"><button class="control" id="previous" aria-label="上一套风格">←</button><button class="control" id="next" aria-label="下一套风格">→</button></div></div></section>
<section class="overview" hidden aria-label="同一风格四页对比"></section>
<footer>源自《仝学官网需求备忘录》v1.0 · 视觉选型稿 · 可离线打开 · 方向键切换风格 · 顶部切换页面 · 支持光效暂停</footer></main></div>
